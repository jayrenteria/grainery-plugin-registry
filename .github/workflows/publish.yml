name: Publish registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test signing
        run: node --test tests/*.test.mjs
      - name: Validate and generate signed registry
        env:
          REGISTRY_SIGNING_KEY_ID: ${{ vars.REGISTRY_SIGNING_KEY_ID }}
          REGISTRY_SIGNING_PRIVATE_KEY: ${{ secrets.REGISTRY_SIGNING_PRIVATE_KEY }}
          PUSH_BASE_REF: ${{ github.event.before }}
        shell: bash
        run: |
          base_ref="$PUSH_BASE_REF"
          if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then
            base_ref="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$base_ref" ]]; then
            node scripts/build-registry.mjs --base-ref "$base_ref"
          else
            node scripts/build-registry.mjs
          fi
      - name: Build marketplace
        run: npm run build
      - name: Deploy static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
